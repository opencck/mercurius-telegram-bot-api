name: CI

# Economical by design: the image is not built here (tdlib takes long and much memory); the script is checked.
on:
  push:
    branches: [master]
    paths-ignore: ['**.md']
  pull_request:
    branches: [master]
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: sh -n entrypoint.sh && sh -n probe.sh && shellcheck entrypoint.sh probe.sh
